<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミニ動物タワーバトル</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<script>
const { Engine, Render, Runner, Bodies, Composite } = Matter;

const ANIMAL_PATHS = [
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%202.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%203.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%204.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%205.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%206.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%207.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%208.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%209.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2010.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2011.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2012.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2013.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2014.jpg',
    'src/img/iloveimg-converted/HEIF%E7%94%BB%E5%83%8F%2015.jpg',
];

// 背景色を透過に変換（左上のピクセルを背景色として検出）
function removeBackground(img, threshold = 40) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    // 左上のピクセルを背景色として取得
    const bgR = data[0], bgG = data[1], bgB = data[2];

    for (let i = 0; i < data.length; i += 4) {
        const diff = Math.sqrt(
            Math.pow(data[i]   - bgR, 2) +
            Math.pow(data[i+1] - bgG, 2) +
            Math.pow(data[i+2] - bgB, 2)
        );
        if (diff < threshold) data[i+3] = 0; // 透明にする
    }

    ctx.putImageData(imageData, 0, 0);
    return canvas.toDataURL('image/png');
}

// 画像プリロード＋背景透過処理
const loadedImages = [];
Promise.all(
    ANIMAL_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            const transparentPath = removeBackground(img);
            resolve({ path: transparentPath, w: img.naturalWidth, h: img.naturalHeight });
        };
        img.onerror = () => { console.warn('読み込み失敗:', path); resolve(null); };
        img.src = path;
    }))
).then(results => {
    loadedImages.push(...results.filter(Boolean));
    console.log(`読み込み完了: ${loadedImages.length}枚`);
});

const engine = Engine.create();
const render = Render.create({
    element: document.body,
    engine: engine,
    options: {
        width: 400,
        height: 600,
        wireframes: false,
        background: '#e0f7fa'
    }
});

Render.run(render);
Runner.run(Runner.create(), engine);

const ground = Bodies.rectangle(200, 500, 200, 40, {
    isStatic: true,
    render: { fillStyle: '#4caf50' }
});
Composite.add(engine.world, ground);

window.addEventListener('click', (event) => {
    const rect = render.canvas.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    if (mouseX < 0 || mouseX > 400) return;

    if (loadedImages.length === 0) {
        console.warn('画像がまだ読み込まれていません');
        return;
    }

    const size = 60;
    const animal = loadedImages[Math.floor(Math.random() * loadedImages.length)];

    const animalBlock = Bodies.rectangle(mouseX, 50, size, size, {
        restitution: 0.1,
        friction: 0.05,
        render: {
            sprite: {
                texture: animal.path,
                xScale: size / animal.w,
                yScale: size / animal.h
            }
        }
    });

    Composite.add(engine.world, animalBlock);
});
</script>
</body>
</html>
