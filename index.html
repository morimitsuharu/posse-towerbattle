<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミニ動物タワーバトル</title>
    <script src="https://cdn.jsdelivr.net/npm/pathseg@1.2.1/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(180deg,#66d9ff 0%,#a7f0ff 100%); display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container {
            position: relative; width: 400px; height: 600px;
            overflow: hidden; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #game-container canvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; }
        .sun {
            position: absolute; right: -130px; top: -130px;
            width: 400px; height: 400px;
            z-index: 1; pointer-events: none;
        }
        /* 雲 */
        .cloud {
            position: absolute; background: rgba(255,255,255,0.93);
            border-radius: 50px; z-index: 1; left: 0;
            transition: opacity 0.18s linear;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute;
            background: rgba(255,255,255,0.93); border-radius: 50%;
        }
        @keyframes cloudFloat {
            from { transform: translateX(440px); }
            to   { transform: translateX(-120px); }
        }
        .cloud1 { width: 90px; height: 28px; top: 52px;  animation: cloudFloat 16s linear infinite -2s; }
        .cloud1::before { width: 44px; height: 44px; top: -23px; left: 13px; }
        .cloud1::after  { width: 30px; height: 30px; top: -16px; right: 13px; }
        .cloud2 { width: 68px; height: 22px; top: 150px; animation: cloudFloat 21s linear infinite -9s; }
        .cloud2::before { width: 34px; height: 34px; top: -18px; left: 10px; }
        .cloud2::after  { width: 24px; height: 24px; top: -13px; right: 10px; }
        .cloud3 { width: 58px; height: 20px; top: 86px;  animation: cloudFloat 13s linear infinite -5s; }
        .cloud3::before { width: 28px; height: 28px; top: -15px; left: 9px; }
        .cloud3::after  { width: 20px; height: 20px; top: -11px; right: 9px; }
        .cloud.is-over-sun { opacity: 0.38; }
        #score-display {
            position: absolute; top: 10px; left: 10px; z-index: 3;
            background: rgba(255,255,255,0.88); border-radius: 10px;
            padding: 5px 14px; font-size: 15px; font-weight: 700;
            color: #e91e63; box-shadow: 0 2px 8px rgba(0,0,0,0.13);
            pointer-events: none; font-family: sans-serif;
        }
        #rotateBtn {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: 18px; padding: 12px 22px; background: #fff;
            border-radius: 12px; border: 3px solid #ffc0cb; color: #e91e63;
            font-weight: 700; z-index: 9999; box-shadow: 0 6px 14px rgba(0,0,0,0.15); cursor: pointer;
        }
        #rotateBtn:active { transform: translateX(-50%) scale(0.98); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">スコア: 0</div>
        <div class="sun">
            <img src="src/img/iloveimg-converted/shotosun.png" alt="太陽" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>
    <button id="rotateBtn" title="回転">回転↻</button>
<script>
const { Engine, Render, Runner, Bodies, Composite, Vertices, Body } = Matter;

(function() {
    const bgPath = 'src/img/background.png';
    const img = new Image();
    img.onload = () => { document.body.style.background = `url('${bgPath}') center top / cover no-repeat`; };
    img.onerror = () => { console.warn('背景画像が見つかりません: ' + bgPath); };
    img.src = bgPath;
})();

const BASE_SIZE = 120;

const PROCESSED_PATHS = [
    'src/img/iloveimg-converted/shoto.png1.png',
    'src/img/iloveimg-converted/shoto.png2.png',
    'src/img/iloveimg-converted/shoto.png3.png',
    'src/img/iloveimg-converted/shoto.png4.png',
    'src/img/iloveimg-converted/shoto.png5.png',
    'src/img/iloveimg-converted/shoto.png6.png',
    'src/img/iloveimg-converted/shoto.png7.png',
    'src/img/iloveimg-converted/shoto.png8.png',
    'src/img/iloveimg-converted/shoto.png9.png',
    'src/img/iloveimg-converted/shoto.png10.png',
    'src/img/iloveimg-converted/shoto.png11.png',
    'src/img/iloveimg-converted/shoto.png12.png',
    'src/img/iloveimg-converted/shoto.png13.png',
    'src/img/iloveimg-converted/shoto.png14.png',
    'src/img/iloveimg-converted/shoto.png15.png',
];

const UNPROCESSED_PATHS = [
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%971.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%972.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%973.png',
];

function prepareAnimal(img, bgRemove) {
    if (!img.naturalWidth || !img.naturalHeight) { console.warn('画像サイズ不正:', img.src); return null; }
    let tw, th;
    if (img.naturalWidth > img.naturalHeight) {
        tw = BASE_SIZE; th = Math.round(BASE_SIZE * img.naturalHeight / img.naturalWidth);
    } else {
        th = BASE_SIZE; tw = Math.round(BASE_SIZE * img.naturalWidth / img.naturalHeight);
    }
    let path = img.src, vertices = null;
    try {
        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = img.naturalWidth; srcCanvas.height = img.naturalHeight;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(img, 0, 0);
        if (bgRemove) {
            const id = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
            const d = id.data;
            const bgR = d[0], bgG = d[1], bgB = d[2];
            for (let i = 0; i < d.length; i += 4) {
                const diff = Math.sqrt(Math.pow(d[i]-bgR,2)+Math.pow(d[i+1]-bgG,2)+Math.pow(d[i+2]-bgB,2));
                if (diff < 40) d[i+3] = 0;
            }
            srcCtx.putImageData(id, 0, 0);
        }
        const dstCanvas = document.createElement('canvas');
        dstCanvas.width = tw; dstCanvas.height = th;
        const dstCtx = dstCanvas.getContext('2d');
        dstCtx.drawImage(srcCanvas, 0, 0, tw, th);
        const id2 = dstCtx.getImageData(0, 0, tw, th);
        const d2 = id2.data;
        const points = [];
        for (let y = 0; y < th; y += 2)
            for (let x = 0; x < tw; x += 2)
                if (d2[(y * tw + x) * 4 + 3] > 0) points.push({ x, y });
        vertices = points.length > 3 ? Vertices.hull(points) : null;
        path = dstCanvas.toDataURL('image/png');
    } catch(e) { console.warn('Canvas処理スキップ:', img.src, '-', e.message); }
    return { path, vertices, w: tw, h: th };
}

const loadedImages = [];
if (location.protocol === 'file:') console.warn('⚠️ file://で動作中。ローカルサーバー推奨: python -m http.server 8080');

Promise.all([
    ...PROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { console.log('✅', path); resolve(prepareAnimal(img, false)); };
        img.onerror = () => { console.error('❌', path); resolve(null); };
        img.src = path;
    })),
    ...UNPROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { console.log('✅', path); resolve(prepareAnimal(img, true)); };
        img.onerror = () => { console.error('❌', path); resolve(null); };
        img.src = path;
    })),
]).then(results => {
    loadedImages.push(...results.filter(Boolean));
    console.log(`読み込み完了: ${loadedImages.length} / ${PROCESSED_PATHS.length + UNPROCESSED_PATHS.length}枚`);
});

const engine = Engine.create();
const render = Render.create({
    element: document.getElementById('game-container'),
    engine: engine,
    options: { width: 400, height: 600, wireframes: false, background: 'transparent' }
});
Render.run(render);
Runner.run(Runner.create(), engine);

const ground = Bodies.rectangle(200, 500, 200, 40, { isStatic: true, render: { fillStyle: '#4caf50' } });
Composite.add(engine.world, ground);

let currentRotationDeg = 0, heldBody = null, heldIsArray = false, heldAnimal = null;
const holdY = 50;
const droppedBodies = [];
const scoreDisplay = document.getElementById('score-display');

setInterval(() => {
    const stable = droppedBodies.filter(b => b.speed < 0.18 && Math.abs(b.angularVelocity) < 0.05 && b.position.y < 620);
    scoreDisplay.textContent = `スコア: ${stable.length}`;
}, 400);

const rotateBtn = document.getElementById('rotateBtn');
rotateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentRotationDeg = (currentRotationDeg + 30) % 360;
    rotateBtn.textContent = `回転↻ (${currentRotationDeg}°)`;
    const angleRad = currentRotationDeg * Math.PI / 180;
    if (heldBody) {
        if (heldIsArray) heldBody.forEach(b => Body.setAngle(b, angleRad));
        else Body.setAngle(heldBody, angleRad);
    }
});

function createAnimalBodyAt(animal, x, y, isStatic) {
    const opts = {
        restitution: 0.1, friction: 0.05, isStatic: !!isStatic,
        render: { sprite: { texture: animal.path, xScale: 1, yScale: 1 } }
    };
    if (animal.vertices && animal.vertices.length > 2) {
        const body = Bodies.fromVertices(x, y, animal.vertices, opts, true);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    } else {
        const body = Bodies.rectangle(x, y, animal.w, animal.h, opts);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    }
}

function setHeldPosition(clientX) {
    if (!heldBody) return;
    const rect = render.canvas.getBoundingClientRect();
    let x = clientX - rect.left;
    if (x < 10) x = 10;
    if (x > render.options.width - 10) x = render.options.width - 10;
    if (heldIsArray) heldBody.forEach(b => Body.setPosition(b, { x, y: holdY }));
    else Body.setPosition(heldBody, { x, y: holdY });
}

render.canvas.addEventListener('mousemove', (e) => setHeldPosition(e.clientX));
render.canvas.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) setHeldPosition(e.touches[0].clientX);
}, { passive: false });

render.canvas.addEventListener('click', (event) => {
    const rect = render.canvas.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    if (mouseX < 0 || mouseX > render.options.width) return;
    if (loadedImages.length === 0) { console.warn('画像がまだ読み込まれていません'); return; }

    if (heldBody) {
        if (heldIsArray) {
            heldBody.forEach(b => { Body.setStatic(b, false); Body.applyForce(b, b.position, { x: 0, y: 0.002 }); });
            droppedBodies.push(...heldBody);
        } else {
            Body.setStatic(heldBody, false);
            Body.applyForce(heldBody, heldBody.position, { x: 0, y: 0.002 });
            droppedBodies.push(heldBody);
        }
        heldBody = null; heldAnimal = null; heldIsArray = false;
        return;
    }

    const animal = loadedImages[Math.floor(Math.random() * loadedImages.length)];
    const { body } = createAnimalBodyAt(animal, mouseX, holdY, true);
    if (!body) return;

    if (Array.isArray(body)) {
        body.forEach(b => { Body.setAngle(b, currentRotationDeg * Math.PI / 180); Composite.add(engine.world, b); });
        heldBody = body; heldIsArray = true;
    } else {
        Body.setAngle(body, currentRotationDeg * Math.PI / 180);
        Composite.add(engine.world, body);
        heldBody = body; heldIsArray = false;
    }
    heldAnimal = animal;
});

const sunEl = document.querySelector('.sun');
const cloudEls = Array.from(document.querySelectorAll('.cloud'));

function isOverlappingRect(a, b) {
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function updateCloudSunOverlap() {
    if (!sunEl || cloudEls.length === 0) return;
    const sunRect = sunEl.getBoundingClientRect();
    cloudEls.forEach((cloud) => {
        const cloudRect = cloud.getBoundingClientRect();
        cloud.classList.toggle('is-over-sun', isOverlappingRect(cloudRect, sunRect));
    });
    requestAnimationFrame(updateCloudSunOverlap);
}
requestAnimationFrame(updateCloudSunOverlap);
</script>
</body>
</html>
