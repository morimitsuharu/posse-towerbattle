<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ミニ動物タワーバトル</title>
    <script src="https://cdn.jsdelivr.net/npm/pathseg@1.2.1/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            margin: 0; padding: max(12px, env(safe-area-inset-top, 0px)) 12px calc(84px + var(--safe-bottom));
            background: linear-gradient(180deg,#66d9ff 0%,#a7f0ff 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh;
            overscroll-behavior: none; touch-action: none;
        }
        canvas {
            display: block; width: min(100%, 400px); height: auto;
            max-height: calc(100dvh - 108px - var(--safe-bottom));
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: transparent;
        }
        #rotateBtn {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(18px + var(--safe-bottom)); padding: 12px 22px; background: #fff;
            border-radius: 12px; border: 3px solid #ffc0cb; color: #e91e63;
            font-size: 16px; font-weight: 700; line-height: 1; z-index: 9999; box-shadow: 0 6px 14px rgba(0,0,0,0.15); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #rotateBtn:active { transform: translateX(-50%) scale(0.98); }
        @media (max-width: 480px) {
            body {
                padding: max(10px, env(safe-area-inset-top, 0px)) 8px calc(92px + var(--safe-bottom));
                align-items: flex-start;
            }
            canvas {
                width: min(100%, 400px, calc(66dvh - 20px));
                max-height: calc(100dvh - 112px - var(--safe-bottom));
            }
            #rotateBtn {
                min-width: 132px; padding: 15px 24px; border-radius: 14px; font-size: 18px;
                bottom: calc(18px + var(--safe-bottom));
            }
        }
    </style>
</head>
<body>
    <button id="rotateBtn" title="回転">回転↻</button>
<script>
const { Engine, Render, Runner, Bodies, Composite, Vertices, Body, Events } = Matter;

(function() {
    const bgPath = 'src/img/background.png';
    const img = new Image();
    img.onload = () => { document.body.style.background = `url('${bgPath}') center top / cover no-repeat`; };
    img.onerror = () => { console.warn('背景画像が見つかりません: ' + bgPath); };
    img.src = bgPath;
})();

// ★ 全画像をこのサイズ（長辺）に統一
const BASE_SIZE = 120;

const PROCESSED_PATHS = [
    'src/img/iloveimg-converted/shoto.png1.png',
    'src/img/iloveimg-converted/shoto.png2.png',
    'src/img/iloveimg-converted/shoto.png3.png',
    'src/img/iloveimg-converted/shoto.png4.png',
    'src/img/iloveimg-converted/shoto.png5.png',
    'src/img/iloveimg-converted/shoto.png6.png',
    'src/img/iloveimg-converted/shoto.png7.png',
    'src/img/iloveimg-converted/shoto.png8.png',
    'src/img/iloveimg-converted/shoto.png9.png',
    'src/img/iloveimg-converted/shoto.png10.png',
    'src/img/iloveimg-converted/shoto.png11.png',
    'src/img/iloveimg-converted/shoto.png12.png',
    'src/img/iloveimg-converted/shoto.png13.png',
    'src/img/iloveimg-converted/shoto.png14.png',
    'src/img/iloveimg-converted/shoto.png15.png',
];

const UNPROCESSED_PATHS = [
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%971.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%972.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%973.png',
];

// 全画像をBASE_SIZEにリサイズ → 必要なら背景透過 → vertices抽出
function prepareAnimal(img, bgRemove) {
    // アスペクト比を維持してリサイズ後のサイズを計算
    let tw, th;
    if (img.naturalWidth > img.naturalHeight) {
        tw = BASE_SIZE;
        th = Math.round(BASE_SIZE * img.naturalHeight / img.naturalWidth);
    } else {
        th = BASE_SIZE;
        tw = Math.round(BASE_SIZE * img.naturalWidth / img.naturalHeight);
    }

    // 元サイズで描画して背景除去
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = img.naturalWidth;
    srcCanvas.height = img.naturalHeight;
    const srcCtx = srcCanvas.getContext('2d');
    srcCtx.drawImage(img, 0, 0);

    if (bgRemove) {
        const id = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
        const d = id.data;
        const bgR = d[0], bgG = d[1], bgB = d[2];
        for (let i = 0; i < d.length; i += 4) {
            const diff = Math.sqrt(
                Math.pow(d[i] - bgR, 2) +
                Math.pow(d[i+1] - bgG, 2) +
                Math.pow(d[i+2] - bgB, 2)
            );
            if (diff < 40) d[i+3] = 0;
        }
        srcCtx.putImageData(id, 0, 0);
    }

    // BASE_SIZEにリサイズしたcanvasを作成（これがテクスチャになる）
    const dstCanvas = document.createElement('canvas');
    dstCanvas.width = tw;
    dstCanvas.height = th;
    const dstCtx = dstCanvas.getContext('2d');
    dstCtx.drawImage(srcCanvas, 0, 0, tw, th);

    // リサイズ後のcanvasからvertices抽出
    const id2 = dstCtx.getImageData(0, 0, tw, th);
    const d2 = id2.data;
    const points = [];
    for (let y = 0; y < th; y += 2) {
        for (let x = 0; x < tw; x += 2) {
            if (d2[(y * tw + x) * 4 + 3] > 0) points.push({ x, y });
        }
    }
    const vertices = points.length > 3 ? Vertices.hull(points) : null;

    return {
        path: dstCanvas.toDataURL('image/png'),
        vertices,
        w: tw,
        h: th
    };
}

const loadedImages = [];
Promise.all([
    ...PROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(prepareAnimal(img, false));
        img.onerror = () => { console.warn('読み込み失敗:', path); resolve(null); };
        img.src = path;
    })),
    ...UNPROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(prepareAnimal(img, true));
        img.onerror = () => { console.warn('読み込み失敗:', path); resolve(null); };
        img.src = path;
    })),
]).then(results => {
    loadedImages.push(...results.filter(Boolean));
    console.log(`読み込み完了: ${loadedImages.length}枚`);
    prepareNextAnimal();
});

const engine = Engine.create();
const render = Render.create({
    element: document.body,
    engine: engine,
    options: { width: 400, height: 600, wireframes: false, background: 'transparent' }
});
Render.run(render);
Runner.run(Runner.create(), engine);

const ground = Bodies.rectangle(200, 500, 200, 40, {
    isStatic: true,
    render: { fillStyle: '#4caf50' }
});
Composite.add(engine.world, ground);

let currentRotationDeg = 0;
let heldBody = null;
let heldIsArray = false;
let heldAnimal = null;
let dropWatch = null;
let activePointer = null;
let lastAimX = 200;
const holdY = 50;
const DROP_FORCE_Y = 0.002;
const DROP_MIN_SETTLE_MS = 700;
const DROP_STOP_HOLD_MS = 600;
const DROP_STOP_SPEED = 0.25;
const DROP_STOP_ANGULAR_SPEED = 0.025;
const FALL_UNLOCK_EXTRA_Y = 100;
const TAP_MAX_MS = 350;
const TAP_MOVE_TOLERANCE = 10;

const rotateBtn = document.getElementById('rotateBtn');
function updateRotationButton() {
    rotateBtn.textContent = currentRotationDeg === 0 ? '回転↻' : `回転↻ (${currentRotationDeg}°)`;
}

function resetRotation() {
    currentRotationDeg = 0;
    updateRotationButton();
}

rotateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentRotationDeg = (currentRotationDeg + 30) % 360;
    updateRotationButton();
    const angleRad = currentRotationDeg * Math.PI / 180;
    if (heldBody) {
        if (heldIsArray) {
            heldBody.forEach(b => Body.setAngle(b, angleRad));
        } else {
            Body.setAngle(heldBody, angleRad);
        }
    }
});

function createAnimalBodyAt(animal, x, y, isStatic) {
    // テクスチャはすでにBASE_SIZEに正規化済みなのでxScale/yScale = 1
    const opts = {
        restitution: 0.1,
        friction: 0.05,
        isStatic: !!isStatic,
        render: { sprite: { texture: animal.path, xScale: 1, yScale: 1 } }
    };

    if (animal.vertices && animal.vertices.length > 2) {
        const body = Bodies.fromVertices(x, y, animal.vertices, opts, true);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    } else {
        const body = Bodies.rectangle(x, y, animal.w, animal.h, opts);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    }
}

function getCanvasPoint(clientX, clientY) {
    const rect = render.canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (render.options.width / rect.width);
    const y = (clientY - rect.top) * (render.options.height / rect.height);
    if (x < 0 || x > render.options.width || y < 0 || y > render.options.height) return null;
    return { x, y };
}

function setHeldPosition(clientX, clientY) {
    const point = getCanvasPoint(clientX, clientY);
    if (!point) return false;
    let x = point.x;
    if (x < 10) x = 10;
    if (x > render.options.width - 10) x = render.options.width - 10;
    lastAimX = x;
    if (!heldBody) return true;
    if (heldIsArray) {
        heldBody.forEach(b => Body.setPosition(b, { x, y: holdY }));
    } else {
        Body.setPosition(heldBody, { x, y: holdY });
    }
    return true;
}

function toBodyList(body) {
    if (Array.isArray(body)) return body.filter(Boolean);
    return body ? [body] : [];
}

function clearHeldBody() {
    heldBody = null;
    heldAnimal = null;
    heldIsArray = false;
}

function startDropWatch(bodies) {
    dropWatch = {
        bodies,
        releasedAt: performance.now(),
        stoppedSince: null
    };
}

function hasBodyStopped(body) {
    const speed = Math.hypot(body.velocity.x, body.velocity.y);
    return speed <= DROP_STOP_SPEED && Math.abs(body.angularVelocity) <= DROP_STOP_ANGULAR_SPEED;
}

function hasBodyFallen(body) {
    return body.bounds.min.y > render.options.height + FALL_UNLOCK_EXTRA_Y;
}

function finishDropWatch(removeBodies) {
    const bodies = dropWatch.bodies;
    if (removeBodies) {
        bodies.forEach(body => Composite.remove(engine.world, body));
    }
    dropWatch = null;
    prepareNextAnimal();
}

function prepareNextAnimal(x = lastAimX) {
    if (heldBody || dropWatch || loadedImages.length === 0) return false;

    resetRotation();
    const animal = loadedImages[Math.floor(Math.random() * loadedImages.length)];
    const spawnX = Math.max(10, Math.min(render.options.width - 10, x));
    const { body } = createAnimalBodyAt(animal, spawnX, holdY, true);
    if (!body) return false;

    const angleRad = currentRotationDeg * Math.PI / 180;
    if (Array.isArray(body)) {
        body.forEach(b => {
            Body.setAngle(b, angleRad);
            Composite.add(engine.world, b);
        });
        heldBody = body;
        heldIsArray = true;
    } else {
        Body.setAngle(body, angleRad);
        Composite.add(engine.world, body);
        heldBody = body;
        heldIsArray = false;
    }
    heldAnimal = animal;
    lastAimX = spawnX;
    return true;
}

function dropHeldBody() {
    if (!heldBody || dropWatch) return false;

    const droppedBodies = toBodyList(heldBody);
    droppedBodies.forEach(b => {
        Body.setStatic(b, false);
        Body.applyForce(b, b.position, { x: 0, y: DROP_FORCE_Y });
    });
    startDropWatch(droppedBodies);
    clearHeldBody();
    resetRotation();
    return true;
}

Events.on(engine, 'afterUpdate', () => {
    if (!dropWatch) return;

    const now = performance.now();
    const bodies = dropWatch.bodies.filter(body => Composite.get(engine.world, body.id, 'body'));
    if (bodies.length === 0) {
        dropWatch = null;
        prepareNextAnimal();
        return;
    }
    dropWatch.bodies = bodies;

    if (bodies.every(hasBodyFallen)) {
        finishDropWatch(true);
        return;
    }

    if (now - dropWatch.releasedAt < DROP_MIN_SETTLE_MS) {
        dropWatch.stoppedSince = null;
        return;
    }

    if (bodies.every(hasBodyStopped)) {
        if (dropWatch.stoppedSince === null) dropWatch.stoppedSince = now;
        if (now - dropWatch.stoppedSince >= DROP_STOP_HOLD_MS) finishDropWatch(false);
    } else {
        dropWatch.stoppedSince = null;
    }
});

render.canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);
    activePointer = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        startedAt: performance.now(),
        moved: false
    };
    if (render.canvas.setPointerCapture) render.canvas.setPointerCapture(event.pointerId);
});

render.canvas.addEventListener('pointermove', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);

    if (!activePointer || activePointer.id !== event.pointerId) return;
    const dx = event.clientX - activePointer.x;
    const dy = event.clientY - activePointer.y;
    if (Math.hypot(dx, dy) > TAP_MOVE_TOLERANCE) {
        activePointer.moved = true;
    }
});

render.canvas.addEventListener('pointerup', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);

    if (!activePointer || activePointer.id !== event.pointerId) return;
    const elapsed = performance.now() - activePointer.startedAt;
    const shouldDrop = !activePointer.moved && elapsed <= TAP_MAX_MS;
    activePointer = null;
    if (render.canvas.releasePointerCapture) render.canvas.releasePointerCapture(event.pointerId);
    if (shouldDrop) dropHeldBody();
});

render.canvas.addEventListener('pointercancel', (event) => {
    if (activePointer && activePointer.id === event.pointerId) {
        activePointer = null;
    }
    if (render.canvas.releasePointerCapture) render.canvas.releasePointerCapture(event.pointerId);
});
</script>
</body>
</html>
