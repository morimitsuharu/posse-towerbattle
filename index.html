<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="apple-touch-icon" href="src/img/apple-touch-icon.png">
    <title>ミニ動物タワーバトル</title>
    <script src="https://cdn.jsdelivr.net/npm/pathseg@1.2.1/pathseg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --firework-burst-top: 48%;
            --firework-launch-distance: 43dvh;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            position: relative; isolation: isolate;
            margin: 0; padding: max(12px, env(safe-area-inset-top, 0px)) 12px calc(84px + var(--safe-bottom));
            background: linear-gradient(180deg,#66d9ff 0%,#a7f0ff 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            overscroll-behavior: none; touch-action: none;
        }

        #game-container {
            position: relative;
            width: min(100%, 400px, calc((100dvh - 108px - var(--safe-bottom)) * 2 / 3));
            height: min(600px, calc(100dvh - 108px - var(--safe-bottom)));
            overflow: hidden; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #game-container canvas {
            position: absolute; top: 0; left: 0; z-index: 2;
            width: 100%; height: 100%; background: transparent; display: block;
        }
        .sun {
            position: absolute; right: -32.5%; top: -21.6667%;
            width: 100%; height: 66.6667%;
            z-index: 1; pointer-events: none;
        }
        /* 雲 */
        .cloud {
            position: absolute; background: rgba(255,255,255,0.93);
            border-radius: 50px; z-index: 1; left: 0;
            transition: opacity 0.18s linear;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute;
            background: rgba(255,255,255,0.93); border-radius: 50%;
        }
        @keyframes cloudFloat {
            from { transform: translateX(440px); }
            to   { transform: translateX(-120px); }
        }
        .cloud1 { width: 22.5%; height: 4.6667%; top: 8.6667%;  animation: cloudFloat 16s linear infinite -2s; }
        .cloud1::before { width: 11%; height: 7.3333%; top: -3.8333%; left: 3.25%; }
        .cloud1::after  { width: 7.5%; height: 5%; top: -2.6667%; right: 3.25%; }
        .cloud2 { width: 17%; height: 3.6667%; top: 25%; animation: cloudFloat 21s linear infinite -9s; }
        .cloud2::before { width: 8.5%; height: 5.6667%; top: -3%; left: 2.5%; }
        .cloud2::after  { width: 6%; height: 4%; top: -2.1667%; right: 2.5%; }
        .cloud3 { width: 14.5%; height: 3.3333%; top: 14.3333%;  animation: cloudFloat 13s linear infinite -5s; }
        .cloud3::before { width: 7%; height: 4.6667%; top: -2.5%; left: 2.25%; }
        .cloud3::after  { width: 5%; height: 3.3333%; top: -1.8333%; right: 2.25%; }
        .cloud.is-over-sun { opacity: 0.38; }
        #score-display {
            position: absolute; top: 10px; left: 10px; z-index: 3;
            background: rgba(255,255,255,0.88); border-radius: 10px;
            padding: 5px 14px; font-size: 15px; font-weight: 700;
            color: #e91e63; box-shadow: 0 2px 8px rgba(0,0,0,0.13);
            pointer-events: none; font-family: sans-serif;
        }

        body.fireworks-active {
            background: #000 !important;
        }
        body::before {
            content: ""; position: fixed; left: 50%; top: var(--firework-burst-top);
            width: min(92vw, 980px, 114dvh); aspect-ratio: 3 / 2;
            z-index: 0; pointer-events: none; opacity: 0;
            background: url('src/img/fireworks-transparent.png') center center / contain no-repeat;
            filter:
                drop-shadow(0 0 9px rgba(255, 255, 255, 0.85))
                drop-shadow(0 0 22px rgba(255, 39, 158, 0.82))
                drop-shadow(0 0 42px rgba(255, 39, 158, 0.38));
            transform: translate(-50%, -50%) scale(0.82); transform-origin: center center;
            will-change: opacity, transform;
        }
        body::after {
            content: ""; position: fixed; left: 50%; top: var(--firework-burst-top);
            width: 7px; height: 7px; border-radius: 999px; z-index: 0; pointer-events: none;
            opacity: 0; background: #fff9ff;
            box-shadow:
                0 14px 0 rgba(255, 72, 184, 0.95),
                0 28px 0 rgba(255, 72, 184, 0.72),
                0 42px 0 rgba(255, 72, 184, 0.48),
                0 56px 0 rgba(255, 72, 184, 0.24),
                0 0 14px rgba(255, 255, 255, 0.88),
                0 0 24px rgba(255, 35, 164, 0.75);
            transform: translate(-50%, var(--firework-launch-distance)) scale(0.7);
            will-change: opacity, transform, box-shadow;
        }
        canvas {
            position: relative; z-index: 2;
            display: block; width: min(100%, 400px); height: auto;
            max-height: calc(100dvh - 108px - var(--safe-bottom));
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: transparent;
        }
        body.fireworks-active::before {
            animation: fireworksTextReveal 5400ms ease-out forwards;
        }
        body.fireworks-active::after {
            animation: fireworkLaunch 5400ms ease-out forwards;
        }
        @keyframes fireworkLaunch {
            0% {
                opacity: 0; transform: translate(-50%, var(--firework-launch-distance)) scale(0.65);
                box-shadow:
                    0 14px 0 rgba(255, 72, 184, 0.92),
                    0 28px 0 rgba(255, 72, 184, 0.68),
                    0 42px 0 rgba(255, 72, 184, 0.44),
                    0 56px 0 rgba(255, 72, 184, 0.22),
                    0 0 14px rgba(255, 255, 255, 0.88),
                    0 0 24px rgba(255, 35, 164, 0.75);
            }
            8% { opacity: 1; }
            42% {
                opacity: 1; transform: translate(-50%, 0) scale(0.95);
                box-shadow:
                    0 16px 0 rgba(255, 72, 184, 0.86),
                    0 32px 0 rgba(255, 72, 184, 0.58),
                    0 48px 0 rgba(255, 72, 184, 0.32),
                    0 64px 0 rgba(255, 72, 184, 0.14),
                    0 0 18px rgba(255, 255, 255, 0.95),
                    0 0 32px rgba(255, 35, 164, 0.9);
            }
            54% {
                opacity: 1; transform: translate(-50%, 0) scale(1.65);
                box-shadow:
                    0 -70px 0 rgba(255, 255, 255, 0.95),
                    61px -35px 0 rgba(255, 66, 176, 0.9),
                    61px 35px 0 rgba(255, 110, 203, 0.78),
                    0 70px 0 rgba(255, 255, 255, 0.78),
                    -61px 35px 0 rgba(255, 66, 176, 0.9),
                    -61px -35px 0 rgba(255, 110, 203, 0.78);
            }
            68% {
                opacity: 0.65; transform: translate(-50%, 0) scale(2.55);
                box-shadow:
                    0 -96px 0 rgba(255, 255, 255, 0.35),
                    83px -48px 0 rgba(255, 66, 176, 0.3),
                    83px 48px 0 rgba(255, 110, 203, 0.25),
                    0 96px 0 rgba(255, 255, 255, 0.22),
                    -83px 48px 0 rgba(255, 66, 176, 0.3),
                    -83px -48px 0 rgba(255, 110, 203, 0.25);
            }
            84%, 100% { opacity: 0; transform: translate(-50%, 0) scale(2.8); }
        }
        @keyframes fireworksTextReveal {
            0%, 52% { opacity: 0; transform: translate(-50%, -50%) scale(0.78); }
            58% { opacity: 0; transform: translate(-50%, -50%) scale(0.86); }
            66% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
            82% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.07); }
        }
      
        #rotateBtn {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(18px + var(--safe-bottom)); padding: 12px 22px; background: #fff;
            border-radius: 12px; border: 3px solid #ffc0cb; color: #e91e63;
            font-size: 16px; font-weight: 700; line-height: 1; z-index: 9999;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #rotateBtn:active { transform: translateX(-50%) scale(0.98); }

        #bgmToggle {
            position: fixed; right: 16px; bottom: calc(18px + var(--safe-bottom));
            padding: 10px 14px; background: #fff; border-radius: 12px; border: 2px solid #90caf9;
            color: #1565c0; font-weight: 700; z-index: 9999; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 480px) {
            body {
                padding: max(10px, env(safe-area-inset-top, 0px)) 8px calc(92px + var(--safe-bottom));
                align-items: flex-start;
            }
            #game-container {
                width: min(100%, 400px, calc((100dvh - 112px - var(--safe-bottom)) * 2 / 3));
                height: min(600px, calc(100dvh - 112px - var(--safe-bottom)));
            }
            #rotateBtn {
                min-width: 132px; padding: 15px 24px; border-radius: 14px; font-size: 18px;
                bottom: calc(18px + var(--safe-bottom));
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">スコア: 0</div>
        <div class="sun">
            <img src="src/img/iloveimg-converted/shotosun.png" alt="太陽" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>
    <button id="rotateBtn" title="回転">回転↻</button>
    <button id="bgmToggle" title="BGM: オフ">BGM: オフ</button>
<script>
const { Engine, Render, Runner, Bodies, Composite, Vertices, Body, Events } = Matter;

(function() {
    const bgPath = 'src/img/background.png';
    const img = new Image();
    img.onload = () => { document.body.style.background = `url('${bgPath}') center top / cover no-repeat`; };
    img.onerror = () => { console.warn('背景画像が見つかりません: ' + bgPath); };
    img.src = bgPath;
})();

const BASE_SIZE = 120;

const PROCESSED_PATHS = [
    'src/img/iloveimg-converted/shoto.png1.png',
    'src/img/iloveimg-converted/shoto.png2.png',
    'src/img/iloveimg-converted/shoto.png3.png',
    'src/img/iloveimg-converted/shoto.png4.png',
    'src/img/iloveimg-converted/shoto.png5.png',
    'src/img/iloveimg-converted/shoto.png6.png',
    'src/img/iloveimg-converted/shoto.png7.png',
    'src/img/iloveimg-converted/shoto.png8.png',
    'src/img/iloveimg-converted/shoto.png9.png',
    'src/img/iloveimg-converted/shoto.png10.png',
    'src/img/iloveimg-converted/shoto.png11.png',
    'src/img/iloveimg-converted/shoto.png12.png',
    'src/img/iloveimg-converted/shoto.png13.png',
    'src/img/iloveimg-converted/shoto.png14.png',
    'src/img/iloveimg-converted/shoto.png15.png',
];

const FIREWORK_TRIGGER_PATH = 'src/img/iloveimg-converted/shoto.png5.png';
const FIREWORK_EFFECT_MS = 5500;

const UNPROCESSED_PATHS = [
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%971.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%972.png',
    'src/img/iloveimg-converted/%E7%BF%94%E6%96%973.png',
];

function prepareAnimal(img, bgRemove, sourcePath) {
    if (!img.naturalWidth || !img.naturalHeight) { console.warn('画像サイズ不正:', img.src); return null; }
    let tw, th;
    if (img.naturalWidth > img.naturalHeight) {
        tw = BASE_SIZE; th = Math.round(BASE_SIZE * img.naturalHeight / img.naturalWidth);
    } else {
        th = BASE_SIZE; tw = Math.round(BASE_SIZE * img.naturalWidth / img.naturalHeight);
    }
    let vertices = null;
    try {
        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = img.naturalWidth; srcCanvas.height = img.naturalHeight;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(img, 0, 0);
        if (bgRemove) {
            const id = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
            const d = id.data;
            const bgR = d[0], bgG = d[1], bgB = d[2];
            for (let i = 0; i < d.length; i += 4) {
                const diff = Math.sqrt(Math.pow(d[i]-bgR,2)+Math.pow(d[i+1]-bgG,2)+Math.pow(d[i+2]-bgB,2));
                if (diff < 40) d[i+3] = 0;
            }
            srcCtx.putImageData(id, 0, 0);
        }
      
        const dstCanvas = document.createElement('canvas');
        dstCanvas.width = tw; dstCanvas.height = th;
        const dstCtx = dstCanvas.getContext('2d');
        dstCtx.drawImage(srcCanvas, 0, 0, tw, th);
        const id2 = dstCtx.getImageData(0, 0, tw, th);
        const d2 = id2.data;
        const points = [];
        for (let y = 0; y < th; y += 2)
            for (let x = 0; x < tw; x += 2)
                if (d2[(y * tw + x) * 4 + 3] > 0) points.push({ x, y });
        
        vertices = points.length > 3 ? Vertices.hull(points) : null;

        return {
            sourcePath,
            path: dstCanvas.toDataURL('image/png'),
            vertices,
            w: tw,
            h: th
        };
    } catch(e) { 
        console.warn('Canvas処理スキップ:', img.src, '-', e.message); 
        return null;
    }
}

const loadedImages = [];
if (location.protocol === 'file:') console.warn('⚠️ file://で動作中。ローカルサーバー推奨: python -m http.server 8080');

Promise.all([
    ...PROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(prepareAnimal(img, false, path));
        img.onerror = () => { console.warn('読み込み失敗:', path); resolve(null); };
        img.src = path;
    })),
    ...UNPROCESSED_PATHS.map(path => new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(prepareAnimal(img, true, path));
        img.onerror = () => { console.warn('読み込み失敗:', path); resolve(null); };
        img.src = path;
    })),
]).then(results => {
    loadedImages.push(...results.filter(Boolean));
    console.log(`読み込み完了: ${loadedImages.length}枚`);
    prepareNextAnimal();
});

const engine = Engine.create();
// 落下速度の調整（0.3 = ゆっくり）
engine.world.gravity.y = 0.3;
const render = Render.create({
    element: document.getElementById('game-container'),
    engine: engine,
    options: { width: 400, height: 600, wireframes: false, background: 'transparent' }
});
Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

const ground = Bodies.rectangle(200, 500, 200, 40, { isStatic: true, render: { fillStyle: '#4caf50' } });
Composite.add(engine.world, ground);

// ゲーム管理用の変数（一本化）
let currentRotationDeg = 0;
let heldBody = null;
let heldIsArray = false;
let heldAnimal = null;
let dropWatch = null;
let activePointer = null;
let lastAimX = 200;
const holdY = 50;

const DROP_FORCE_Y = 0.002;
const DROP_MIN_SETTLE_MS = 700;
const DROP_STOP_HOLD_MS = 350;
const DROP_STOP_SPEED = 0.6;
const DROP_STOP_ANGULAR_SPEED = 0.08;
const DROP_MAX_SETTLE_MS = 4200;
const DROP_MAX_SETTLE_SPEED = 1.2;
const DROP_MAX_SETTLE_ANGULAR_SPEED = 0.18;
const FALL_UNLOCK_EXTRA_Y = 100;
const TAP_MAX_MS = 350;
const TAP_MOVE_TOLERANCE = 10;

const rotateBtn = document.getElementById('rotateBtn');
const scoreDisplay = document.getElementById('score-display');
let fireworksTimer = null;

// スコア計算（静止しているオブジェクトをカウント）
setInterval(() => {
    const allBodies = Composite.allBodies(engine.world);
    const stable = allBodies.filter(b => b !== ground && b.speed < 0.18 && Math.abs(b.angularVelocity) < 0.05 && b.position.y < 620);
    scoreDisplay.textContent = `スコア: ${stable.length}`;
}, 400);

function playFireworksEffect() {
    clearTimeout(fireworksTimer);
    document.body.classList.remove('fireworks-active');
    void document.body.offsetWidth;
    document.body.classList.add('fireworks-active');

    fireworksTimer = setTimeout(() => {
        document.body.classList.remove('fireworks-active');
        fireworksTimer = null;
    }, FIREWORK_EFFECT_MS);
}

function updateRotationButton() {
    rotateBtn.textContent = currentRotationDeg === 0 ? '回転↻' : `回転↻ (${currentRotationDeg}°)`;
}

function resetRotation() {
    currentRotationDeg = 0;
    updateRotationButton();
}

rotateBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentRotationDeg = (currentRotationDeg + 30) % 360;
    updateRotationButton();
    const angleRad = currentRotationDeg * Math.PI / 180;
    if (heldBody) {
        if (heldIsArray) heldBody.forEach(b => Body.setAngle(b, angleRad));
        else Body.setAngle(heldBody, angleRad);
    }
});

function createAnimalBodyAt(animal, x, y, isStatic) {
    const opts = {
        restitution: 0,   // 反発なし（ピタッと止まる）
        friction: 0.2,    // 摩擦強め（滑り落ちにくい）
        isStatic: !!isStatic,
        render: { sprite: { texture: animal.path, xScale: 1, yScale: 1 } }
    };
    
    if (animal.vertices && animal.vertices.length > 2) {
        const body = Bodies.fromVertices(x, y, animal.vertices, opts, true);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    } else {
        const body = Bodies.rectangle(x, y, animal.w, animal.h, opts);
        return { body, targetWidth: animal.w, targetHeight: animal.h };
    }
}

function getCanvasPoint(clientX, clientY) {
    const rect = render.canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (render.options.width / rect.width);
    const y = (clientY - rect.top) * (render.options.height / rect.height);
    if (x < 0 || x > render.options.width || y < 0 || y > render.options.height) return null;
    return { x, y };
}

function setHeldPosition(clientX, clientY) {
    const point = getCanvasPoint(clientX, clientY);
    if (!point) return false;
    let x = point.x;
    if (x < 10) x = 10;
    if (x > render.options.width - 10) x = render.options.width - 10;
    lastAimX = x;
    if (!heldBody) return true;
    if (heldIsArray) {
        heldBody.forEach(b => Body.setPosition(b, { x, y: holdY }));
    } else {
        Body.setPosition(heldBody, { x, y: holdY });
    }
    return true;
}

function toBodyList(body) {
    if (Array.isArray(body)) return body.filter(Boolean);
    return body ? [body] : [];
}

function clearHeldBody() {
    heldBody = null;
    heldAnimal = null;
    heldIsArray = false;
}

function startDropWatch(bodies, shouldPlayFireworks) {
    dropWatch = {
        bodies,
        shouldPlayFireworks,
        releasedAt: performance.now(),
        stoppedSince: null
    };
}

function hasBodyStopped(body) {
    const speed = Math.hypot(body.velocity.x, body.velocity.y);
    return speed <= DROP_STOP_SPEED && Math.abs(body.angularVelocity) <= DROP_STOP_ANGULAR_SPEED;
}

function hasBodyMostlySettled(body) {
    const speed = Math.hypot(body.velocity.x, body.velocity.y);
    return speed <= DROP_MAX_SETTLE_SPEED && Math.abs(body.angularVelocity) <= DROP_MAX_SETTLE_ANGULAR_SPEED;
}

function hasBodyFallen(body) {
    return body.bounds.min.y > render.options.height + FALL_UNLOCK_EXTRA_Y;
}

function finishDropWatch(removeBodies) {
    const bodies = dropWatch.bodies;
    const shouldPlayFireworks = dropWatch.shouldPlayFireworks;
    if (removeBodies) {
        bodies.forEach(body => Composite.remove(engine.world, body));
    } else if (shouldPlayFireworks) {
        playFireworksEffect();
    }
    dropWatch = null;
    prepareNextAnimal();
}

function prepareNextAnimal(x = lastAimX) {
    if (heldBody || dropWatch || loadedImages.length === 0) return false;

    resetRotation();
    const animal = loadedImages[Math.floor(Math.random() * loadedImages.length)];
    const spawnX = Math.max(10, Math.min(render.options.width - 10, x));
    const { body } = createAnimalBodyAt(animal, spawnX, holdY, true);
    if (!body) return false;

    const angleRad = currentRotationDeg * Math.PI / 180;
    if (Array.isArray(body)) {
        body.forEach(b => {
            Body.setAngle(b, angleRad);
            Composite.add(engine.world, b);
        });
        heldBody = body;
        heldIsArray = true;
    } else {
        Body.setAngle(body, angleRad);
        Composite.add(engine.world, body);
        heldBody = body; heldIsArray = false;
    }
    heldAnimal = animal;
    lastAimX = spawnX;
    return true;
}

function dropHeldBody() {
    if (!heldBody || dropWatch) return false;

    const shouldPlayFireworks = heldAnimal && heldAnimal.sourcePath === FIREWORK_TRIGGER_PATH;
    const droppedBodiesList = toBodyList(heldBody);
    droppedBodiesList.forEach(b => {
        Body.setStatic(b, false);
        Body.applyForce(b, b.position, { x: 0, y: DROP_FORCE_Y });
    });
    startDropWatch(droppedBodiesList, shouldPlayFireworks);
    clearHeldBody();
    resetRotation();
    return true;
}

let isGameOver = false;

function triggerGameOver() {
    if (isGameOver) return;
    isGameOver = true;

    try { Runner.stop(runner); } catch(e) {}
    try { Render.stop(render); } catch(e) {}

    const container = document.getElementById('game-container');
    const overlay = document.createElement('div');
    overlay.id = 'game-over-overlay';
    Object.assign(overlay.style, {
        position: 'absolute', left: '0', top: '0', width: '100%', height: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexDirection: 'column', gap: '18px', zIndex: 9999,
        background: 'rgba(0,0,0,0.6)', color: '#fff', fontFamily: 'sans-serif'
    });
    const title = document.createElement('div');
    title.textContent = 'GAME OVER';
    title.style.fontSize = '36px';
    title.style.fontWeight = '800';
    const btn = document.createElement('button');
    btn.textContent = 'リトライ';
    Object.assign(btn.style, { padding: '10px 18px', fontSize: '16px', borderRadius: '8px', cursor: 'pointer' });
    btn.addEventListener('click', () => { location.reload(); });
    overlay.appendChild(title);
    overlay.appendChild(btn);
    container.appendChild(overlay);
}

Events.on(engine, 'afterUpdate', () => {
    // どれか一つでも土台から落ちたらゲームオーバー
    if (!isGameOver) {
        const allBodies = Composite.allBodies(engine.world).filter(b => b !== ground);
        if (allBodies.some(hasBodyFallen)) {
            triggerGameOver();
            return;
        }
    }

    if (!dropWatch) return;

    const now = performance.now();
    const bodies = dropWatch.bodies.filter(body => Composite.get(engine.world, body.id, 'body'));
    if (bodies.length === 0) {
        dropWatch = null;
        prepareNextAnimal();
        return;
    }
    dropWatch.bodies = bodies;

    if (bodies.every(hasBodyFallen)) {
        finishDropWatch(true);
        return;
    }

    if (now - dropWatch.releasedAt < DROP_MIN_SETTLE_MS) {
        dropWatch.stoppedSince = null;
        return;
    }

    if (bodies.every(hasBodyStopped)) {
        if (dropWatch.stoppedSince === null) dropWatch.stoppedSince = now;
        if (now - dropWatch.stoppedSince >= DROP_STOP_HOLD_MS) finishDropWatch(false);
    } else if (now - dropWatch.releasedAt >= DROP_MAX_SETTLE_MS && bodies.every(hasBodyMostlySettled)) {
        finishDropWatch(false);
    } else {
        dropWatch.stoppedSince = null;
    }
});

render.canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);
    activePointer = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        startedAt: performance.now(),
        moved: false
    };
    if (render.canvas.setPointerCapture) render.canvas.setPointerCapture(event.pointerId);
});

render.canvas.addEventListener('pointermove', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);

    if (!activePointer || activePointer.id !== event.pointerId) return;
    const dx = event.clientX - activePointer.x;
    const dy = event.clientY - activePointer.y;
    if (Math.hypot(dx, dy) > TAP_MOVE_TOLERANCE) {
        activePointer.moved = true;
    }
});

render.canvas.addEventListener('pointerup', (event) => {
    event.preventDefault();
    setHeldPosition(event.clientX, event.clientY);

    if (!activePointer || activePointer.id !== event.pointerId) return;
    const elapsed = performance.now() - activePointer.startedAt;
    const shouldDrop = !activePointer.moved && elapsed <= TAP_MAX_MS;
    activePointer = null;
    if (render.canvas.releasePointerCapture) render.canvas.releasePointerCapture(event.pointerId);
    if (shouldDrop) dropHeldBody();
});

render.canvas.addEventListener('pointercancel', (event) => {
    if (activePointer && activePointer.id === event.pointerId) {
        activePointer = null;
    }
    if (render.canvas.releasePointerCapture) render.canvas.releasePointerCapture(event.pointerId);
});

const sunEl = document.querySelector('.sun');
const cloudEls = Array.from(document.querySelectorAll('.cloud'));

function isOverlappingRect(a, b) {
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function updateCloudSunOverlap() {
    if (!sunEl || cloudEls.length === 0) return;
    const sunRect = sunEl.getBoundingClientRect();
    cloudEls.forEach((cloud) => {
        const cloudRect = cloud.getBoundingClientRect();
        cloud.classList.toggle('is-over-sun', isOverlappingRect(cloudRect, sunRect));
    });
    requestAnimationFrame(updateCloudSunOverlap);
}
requestAnimationFrame(updateCloudSunOverlap);

// BGM 制御
(function(){
    const bgmPath = 'src/audio/bgm.mp3';
    const bgm = new Audio(bgmPath);
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.5;
    const btn = document.getElementById('bgmToggle');
    function updateBtn(){
        const on = !bgm.paused;
        const text = on ? 'BGM: オン' : 'BGM: オフ';
        btn.textContent = text;
        btn.title = text;
        btn.setAttribute('aria-pressed', on.toString());
    }
    btn.addEventListener('click', ()=>{
        if (bgm.paused) {
            bgm.play().catch((e)=>{
                console.warn('BGMの再生がブロックされました。ユーザー操作で再生してください。', e);
            });
        } else {
            bgm.pause();
        }
        updateBtn();
    });
    try {
        fetch(bgmPath, { method: 'HEAD' }).then(res => { if (!res.ok) console.warn('BGMファイルが見つかりません: ' + bgmPath); }).catch(() => console.warn('BGMチェック失敗: ' + bgmPath));
    } catch(e) { console.warn('BGMチェックスキップ', e); }
    updateBtn();
})();
</script>
